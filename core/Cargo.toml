[package]
name = "openwarp-tunnel"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
boring = { version = "=4.22.0", features = ["pq-experimental"] }
etherparse = "0.20"
libc = "0.2"
quiche = { version = "=0.30.1", default-features = false, features = ["boringssl-boring-crate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tun = "0.8"

[build-dependencies]
cc = "1"

[profile.release]
strip = true
lto = "thin"
